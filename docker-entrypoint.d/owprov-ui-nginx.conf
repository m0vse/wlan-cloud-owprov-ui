server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        try_files $uri =404;
    }
    location /api/ {
        return 404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
